# Web 版（PostgreSQL）一键部署：docker compose up -d  →  http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediflow}
      POSTGRES_DB: mediflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mediflow -d mediflow']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        DB_PROVIDER: postgresql
    image: mediflow:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mediflow:${POSTGRES_PASSWORD:-mediflow}@db:5432/mediflow
      # 生产环境务必设置为随机长字符串（未设置时自动生成并保存在 /data/.jwt-secret）
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
